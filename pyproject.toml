[project]
name = "moose-scout"
version = "0.1.0"
description = "DIY hunt-area intelligence pipeline (moose, northern Quebec)"
requires-python = ">=3.11"
dependencies = []   # pinned in requirements.txt for the Docker build

[project.scripts]
moose-scout = "moose_scout.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
