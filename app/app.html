<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transect — Scouting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=48">
<script>
  /* Access gate. This is UX, not security — the real enforcement is server-side:
     POST /scout now requires a valid account token, so an unauthenticated visitor
     cannot burn engine time even if they bypass this redirect. */
  try{
    var _t = localStorage.getItem('transect_tok') || localStorage.getItem('transect_token');
    if(!_t) location.replace('signin?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search));
  }catch(e){}
</script>
</head>
<body>
<div id="map"></div>

<!-- Top: brand · numbered steps · plan identity · actions -->
<nav id="tabbar">
  <div class="brand">TRANSECT</div>
  <div class="steps">
    <button data-tab="setup"><span class="n">1</span><span data-i18n="tab.setup">Setup</span></button>
    <span class="sep"></span>
    <button data-tab="overview" class="on"><span class="n">2</span><span data-i18n="tab.overview">Overview</span></button>
    <span class="sep"></span>
    <button data-tab="field"><span class="n">3</span><span data-i18n="tab.field">Field</span></button>
    <span class="sep"></span>
    <button data-tab="brief"><span class="n">4</span><span data-i18n="tab.brief">Brief</span></button>
  </div>
  <div id="planbar">
    <div class="pname"><span id="planName">—</span><span class="savedot" id="saveDot" data-s="unsaved">UNSAVED</span></div>
    <div class="pmeta" id="subtitle">loading…</div>
  </div>
  <button id="exportBtn" class="btn btn--secondary btn--sm">Export</button>
  <div class="seg langseg" id="langSeg">
    <button data-lang="en">EN</button><button data-lang="fr">FR</button>
  </div>
  <button id="acctBtn" class="btn btn--ghost btn--sm" title="Account">Account</button>
  <div id="acctMenu" class="hidden"></div>
</nav>

<!-- Left ledger -->
<aside id="panel" class="tabpanel">
  <div id="gate" class="gate"></div>
  <div id="method" class="method"></div>
  <div id="list"></div>
  <div id="detail" class="hidden"></div>
</aside>
<aside id="setup" class="tabpanel hidden"></aside>
<aside id="brief" class="tabpanel hidden"></aside>

<!-- Right: persistent icon rail; transient cards open from their own button -->
<!-- Hunting layers has its own door, beside the sidebar — not in the tool rail -->
<div id="layersPill"></div>
<div id="railStack"><div id="rail"></div><div id="viewRail"></div></div>
<div id="railTip" class="hidden"></div>
<div id="layersDock" class="dock hidden"></div>
<div id="baseDock" class="dock hidden"></div>
<div id="surfDock" class="dock hidden"></div>

<!-- Map controls -->
<div id="mapctl"></div>
<button id="rescopeBtn" class="hidden">↻ Recalculate in my areas</button>

<!-- Bottom: weather / wind days -->
<div id="weather"></div>

<!-- popovers -->
<div id="exportMenu" class="hidden">
  <div class="s" style="margin-bottom:8px">Export this plan's waypoints, routes &amp; areas:</div>
  <button data-fmt="gpx">GPX — OnX / Garmin</button>
  <button data-fmt="kml">KML — Google Earth</button>
  <label class="s" style="display:block;margin-top:10px"><input type="checkbox" id="exZones" checked> include model zones</label>
</div>

<!-- legacy hooks kept so handlers bind cleanly -->
<div id="drawtools"></div>
<div id="legend"></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="i18n.js?v=1"></script>
<script src="icons.js?v=1"></script>
<script src="config.js"></script>
<script src="data.js?v=48"></script>
<script src="area_detail.js?v=48"></script>
<script src="app.js?v=48"></script>
</body>
</html>
