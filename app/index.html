<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transect — Scouting</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<!-- Top: app tabs -->
<nav id="tabbar">
  <div class="brand">TRANSECT</div>
  <button data-tab="setup">Setup</button>
  <button data-tab="overview" class="on">Overview</button>
  <button data-tab="field">Field</button>
  <button data-tab="brief">Brief</button>
  <button id="plansBtn" class="ghost">Plans</button>
  <div id="subtitle">loading…</div>
</nav>

<!-- floating draw / measure toolbar (separate from layer controls) -->
<div id="drawtools"></div>
<!-- saved hunt plans -->
<aside id="plans" class="hidden"></aside>

<!-- Overview: ranked areas + pros/cons (Phase 1) / detail (Phase 2) -->
<aside id="panel" class="tabpanel">
  <div id="gate" class="gate"></div>
  <div id="method" class="method"></div>
  <div id="list"></div>
  <div id="detail" class="hidden"></div>
</aside>

<!-- Setup: scout parameters -->
<aside id="setup" class="tabpanel hidden"></aside>

<!-- Brief: full rationale document -->
<aside id="brief" class="tabpanel hidden"></aside>

<!-- Right: layer + map controls (built in app.js) -->
<aside id="tools"></aside>

<!-- Bottom: weather / wind calendar -->
<div id="weather"></div>

<!-- Legend -->
<div id="legend"></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="data.js?v=15"></script>
<script src="area_detail.js?v=15"></script>
<script src="app.js?v=15"></script>
</body>
</html>
