# Moose (Alces alces) habitat + behaviour model — Quebec boreal.
#
# Weights are the tunable "biology brain" of the Habitat Suitability Model.
# Cover classes mirror the Quebec écoforestière "couvert forestier" legend seen
# on SEPAQ secteur-de-chasse sheets (Portneuf reference), so the model reads the
# same data a Quebec hunter reads off the map.
#
# Scores are relative contributions in [-1, 1]; the HSM normalizes the weighted
# sum to [0, 1]. Positive = draws moose, negative = avoid.

species: moose
scientific_name: "Alces alces"
region_profile: quebec_boreal

# --- Écoforestière cover-type scoring (couvert forestier) --------------------
# Keys are normalized class codes produced by acquire/ecoforestiere.py from the
# raw peuplement attributes. Comments give the map legend label.
cover_types:
  coupe_recente:                 # Coupe récente (<=10 ans) — fresh cut
    label_fr: "Coupe récente (10 ans et moins)"
    browse: 0.55                 # opening up, browse establishing
    cover: -0.30                 # little security cover yet
    note: "Best as EDGE against conifer; interior of large fresh cuts is exposed."
  regeneration:                  # Régénération (10-30 ans) — PRIME browse
    label_fr: "Régénération (10 à 30 ans)"
    browse: 1.00
    cover: 0.20
    note: "Willow/birch/aspen/mountain-ash at moose height. The money class."
  coupe_partielle:               # Coupe partielle, prélèvement <=50%
    label_fr: "Coupe partielle (prélèvement 50% et moins)"
    browse: 0.45
    cover: 0.35                  # retains overstory = browse + cover mix
  feuillus:                      # Feuillus >30 ans — mature hardwood
    label_fr: "Feuillus (plus de 30 ans)"
    browse: 0.20
    cover: 0.25
  melange:                       # Mélangé >30 ans — mature mixedwood
    label_fr: "Mélangé (plus de 30 ans)"
    browse: 0.25
    cover: 0.55                  # classic moose cover+forage interface
  resineux:                      # Résineux >30 ans — mature conifer
    label_fr: "Résineux (plus de 30 ans)"
    browse: -0.20                # low browse under closed canopy
    cover: 0.85                  # thermal/security cover; thermal-refuge input
  aulnaie:                       # Aulnaie — alder (riparian shrub)
    label_fr: "Aulnaie"
    browse: 0.60                 # riparian browse + travel/cover
    cover: 0.40
    wet: 0.7
  tourbiere:                     # Tourbière — peat bog / fen
    label_fr: "Tourbière"
    browse: 0.35
    cover: -0.10
    wet: 1.0                     # aquatic feeding + wallow potential
  non_boise:                     # Non boisé — unforested/rock/barren
    label_fr: "Non boisé"
    browse: -0.30
    cover: -0.40

# --- Hydro / wetland proximity (metres -> score falls off) -------------------
water:
  wetland_optimal_m: 150         # riparian willow / bog edge sweet spot
  wetland_falloff_m: 800
  lakeshore_optimal_m: 100
  beaver_pond_bonus: 0.5         # flowages: aquatic feeding + wallows

# --- Terrain preferences -----------------------------------------------------
terrain:
  prefer_valley_bottoms: 0.4     # low TPI
  prefer_saddles_funnels: 0.6    # travel through pinch points (see funnels)
  south_facing_regen_bonus: 0.3  # warm aspect for early-season browse
  avoid_steep_slope_deg: 25      # moose avoid sustained steep ground
  wallow_twi_min: 8              # high wetness index flats = wallow candidates

# --- Thermal refuge ("climatiseur à orignaux") -------------------------------
# Where moose bed midday when it's hot. Research: moose are heat-sensitive and
# select shade/canopy cover above ~14-17°C, panting/body-temp rise by ~20-25°C
# (Alces; McCann 2013; van Beest 2012). Drives thermal_refuge sites + midday_hot
# routes. Combine dense mature conifer + cool aspect + near water.
thermal_refuge:
  cover_class: resineux
  aspect_cool: [315, 45]         # NW..NE facing (degrees)
  max_dist_to_water_m: 400
  canopy_closure_min: 0.7
  # Graded heat response (°C) — refuge weight ramps from onset to severe.
  heat_onset_c: 14              # activity drops / shade-seeking begins
  heat_bedded_calm_c: 17        # bedded heat-stress threshold, calm
  heat_severe_c: 20             # strong cover selection
  heat_bodytemp_c: 25           # body-temp elevation / panting

# --- Rut & diel behaviour ----------------------------------------------------
# Phenology at ~52degN: pre-rut early/mid Sept, peak rut late Sept–mid Oct.
rut:
  pre_rut: ["09-05", "09-22"]
  peak_rut: ["09-23", "10-15"]
  post_rut: ["10-16", "10-31"]
  calling_min_minutes: 30        # matches Charles Dorris "stations d'appels"
  rut_site_features:             # where to set calling stations
    - cover_open_edge            # cover-to-opening interface
    - funnel                     # pinch points concentrate cruising bulls
    - wetland_complex

# Diel + temperature routing: morning/evening feeding-edge vs midday cover.
diel:
  feeding_windows: ["dawn", "dusk"]     # -> good/best routes on browse edges
  midday_hot_threshold_c: 15            # above this, bias to thermal refuges
  midday_route_target: thermal_refuge   # -> magenta midday_hot routes

# --- Forage & target-sex ecology (research-grounded) -------------------------
# Aquatic feeding is sodium/mineral-driven and ponds yield ~4x terrestrial forage
# (Fraser; MacCracken), so water/wetland is a nutritional magnet, not just water.
# Rut bulls (our target) select forage-rich cutblocks/regen; cows-with-calves
# avoid them (Kupferschmid/forest-harvest review) — so weight regen/cuts UP for a
# bull hunt. Wallows are the rut hub: bulls scent-mark them and they pull cows.
forage:
  aquatic_sodium_magnet: true       # emergent/submergent wetland & lakeshore
  bull_prefers_regen: true          # regen/coupe get a bull-hunt bonus
  bull_regen_bonus: 0.2
  wallow_is_rut_hub: true           # wallows: calling + ambush + scent placement

# --- HSM top-level weighting (how the sub-scores combine) --------------------
# Rebalanced toward COVER-FOOD INTERSPERSION per the validated moose HSI (Allen, Jordan &
# Terrell 1987, USFWS Moose HSI, Lake Superior Region; multi-scale validation Dussault
# 2006): interspersion/edge is the dominant driver and there is no large standalone
# distance-to-water term. Raw water proximity is also season-mismatched here — aquatic
# feeding ends by mid-September, before the hunt — so water is cut to a small riparian /
# travel-corridor weight rather than a forage magnet. Sum = 1.0.
hsm_weights:
  browse: 0.30                    # food
  cover: 0.20                     # security / thermal cover
  water: 0.10                     # riparian browse + travel (NOT aquatic forage in the fall)
  terrain: 0.10
  edge_density: 0.30             # cover<->forage INTERSPERSION — the dominant term (Allen 1987)

# --- Legend / layer symbology (E1) --------------------------------------------
# The species- and region-specific PROSE for every map layer the app draws, so the
# contract carries the legend as DATA (contract.build → doc["legend"]) and the client
# renders names/notes/groups from it rather than hardcoding moose language. Visual
# symbology (colour, icon, texture, edge) still lives with the client generator — it's
# not species-specific. `key` matches the client LAYERS row `k`. A goat or deer species
# config would supply different groups (e.g. ESCAPE TERRAIN) and prose with no app change.
legend_groups: ["MODEL ZONES", "SITES & FEATURES", "ACCESS & HYDRO"]
legend:
  - {key: hz-high,   group: "MODEL ZONES", name: "High likelihood", note: "Model score in the top band"}
  - {key: hz-medium, group: "MODEL ZONES", name: "Medium", note: "Scored, second band"}
  - {key: hz-low,    group: "MODEL ZONES", name: "Low", note: "Scored but not prioritised"}
  - {key: refuge,    group: "MODEL ZONES", name: "Thermal refuge", note: "Cool midday bedding"}
  - {key: browse,    group: "MODEL ZONES", name: "Browse / feeding", note: "Regen & riparian forage — the food itself"}
  - {key: burns,     group: "MODEL ZONES", name: "Burn regeneration", note: "Fire perimeters by age — browse peaks 15–22 yr after a burn. Strongest single predictor here."}
  - {key: cuts,      group: "MODEL ZONES", name: "Recent cuts", note: "Logging cutblocks by age (écoforestière) — pale = fresh, bright green = 10–25 yr prime browse, dark = closing in. South of ~52°N."}
  - {key: funnel,    group: "MODEL ZONES", name: "Funnels / passes", note: "Land necks between water/wetland where travelling bulls squeeze through"}
  - {key: st-rut,    group: "SITES & FEATURES", name: "Rut / calling", note: "Stands of 30 min or more — where you call from"}
  - {key: st-saline, group: "SITES & FEATURES", name: "Feeding edge", note: "Browse edge / riparian willow at first and last light. Not a detected salt lick — salines are regulated; check the zone."}
  - {key: st-glass,  group: "SITES & FEATURES", name: "Glassing knobs", note: "Computed viewshed — high ground worth sitting behind glass"}
  - {key: st-ground, group: "SITES & FEATURES", name: "Ground-truth checks", note: "Go stand here and see if the model was right — sign, tracks, rubs"}
  - {key: camps2,    group: "SITES & FEATURES", name: "Base camp", note: "Where you sleep. Spike hunts only — a vehicle hunt has no camp."}
  - {key: staging,   group: "SITES & FEATURES", name: "Staging / parking", note: "Where you leave the truck — one per focus area, at its nearest road"}
  - {key: shooters,  group: "SITES & FEATURES", name: "Caller / shooter", note: "Shooter ~70 m downwind of the caller"}
  - {key: areas,     group: "SITES & FEATURES", name: "Focus-area outlines", note: "Plan extent — a hull we drew, not a surveyed edge"}
  - {key: thermal,   group: "SITES & FEATURES", name: "Thermal drift", note: "Modelled slope airflow — Field tab, zoom in to read it"}
  - {key: routes,    group: "ACCESS & HYDRO", name: "Hunt lines", note: "The best line to walk in on, from camp to the stand"}
  - {key: access,    group: "ACCESS & HYDRO", name: "Access from staging", note: "Truck to the area — one short leg per focus area, from its own staging point"}
  - {key: roads,     group: "ACCESS & HYDRO", name: "Roads & rail", note: "Reference geography by drivability — bright = paved through-road, thin dashed gold = gravel/logging track you may not get a truck down."}
  - {key: trails,    group: "ACCESS & HYDRO", name: "Trails & sentiers", note: "Foot paths (OSM) plus the official quad/snowmobile sentiers (AQréseau+). NOT drivable in a truck — but an ATV rides them, they beat bushwhacking on foot, and moose travel these corridors. Dotted olive."}
  - {key: tenure,    group: "ACCESS & HYDRO", name: "Closed to you", note: "Exclusive outfitter tenure — hatched red is masked out of the ranking entirely"}
  - {key: tenure-ok, group: "ACCESS & HYDRO", name: "Bookable ground", note: "ZEC or réserve faunique — you may hunt here, but register or reserve first"}
  - {key: boundaries, group: "ACCESS & HYDRO", name: "Borders & places", note: "Reference geography"}
  - {key: water,     group: "ACCESS & HYDRO", name: "Rivers & lakes", note: "Mapped hydrography (OSM)"}
  - {key: wetland,   group: "ACCESS & HYDRO", name: "Wetlands", note: "GRHQ marsh / bog / fen — a travel barrier that shapes the land-bridge funnels, and slow going on foot."}
  - {key: beaver,    group: "SITES & FEATURES", name: "Beaver ponds", note: "GRHQ flowages — a rut hub: bulls scent-mark the wet edge and cows follow. A pond beside cover is worth a stand."}
  - {key: crossings, group: "ACCESS & HYDRO", name: "River crossings", note: "On the access legs. Green = a mapped bridge · amber = fordable · red = assume a boat"}
