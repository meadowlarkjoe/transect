# Global model parameters (species-agnostic). Tunable knobs for the dynamic,
# condition-aware upgrades over a static expert map. See docs/design-improvements.md.

version: 1
working_crs: "EPSG:32198"     # NAD83 / Quebec Lambert — metres, good for area/dist
io_crs: "EPSG:4326"           # WGS84 for GPX/KML I/O
raster_resolution_m: 40       # analysis grid (km-scale moose habitat; memory-safe in a 2GB VM)

# --- Wind & thermals: approach routing enters downwind of target sites --------
wind:
  # If null, briefs are generated for the prevailing rut-season wind and a
  # "swap for your forecast wind" note. CLI/forecast can override per run.
  prevailing_dir_deg: null
  downwind_buffer_deg: 45       # keep approach within +/- this of downwind
  thermals:
    enabled: true
    am_upslope: true            # mornings: air rises -> approach from below
    pm_downslope: true          # evenings: air sinks -> approach from above

# --- Weather: pull forecast for actual hunt dates, drive route/refuge choice ---
weather:
  provider: open-meteo          # free, no key; historical + forecast
  midday_hot_threshold_c: 15    # above -> prefer thermal refuges + magenta routes
  use_forecast_when_within_days: 14

# --- Multi-modal extraction friction (relative cost per metre travelled) ------
# huntability = HSM * exp(-extraction_cost / decay). Lower friction = cheaper.
extraction:
  decay: 2500                   # metres-equivalent; higher = more tolerant of distance
  modes:
    truck:
      on_road: 1.0
      offroad: Infinity         # trucks stay on roads
    atv:
      base: 3.0
      max_slope_deg: 20
      blocked_cover: [tourbiere]      # impassable wetlands
      slope_penalty_per_deg: 0.4
    canoe:
      on_water: 1.5
      portage: 40.0             # heavy penalty to leave water
      max_portage_m: 800
    backpack:
      base: 12.0                # dominant constraint; distance kills
      slope_penalty_per_deg: 0.8
  warm_weather_spoilage_hours: 6  # flag kills whose best pack-out exceeds this

# --- Hunter-pressure surface ---------------------------------------------------
pressure:
  road_decay_m: 1500            # pressure falls off with distance from access
  town_decay_m: 25000
  parking_decay_m: 1000
  # Leased shelters on crown land (T9.8) — a PRESSURE term, never a barrier. Shorter
  # decay than a road: a road carries people past, a cabin is hunted outward from.
  camp_decay_m: 1200
  camp_weight:                  # by lease class; see acquire/baux.py for what each is
    abri_sommaire: 1.00         # built to hunt and trap from — the strongest signal
    pourvoirie_camp: 0.90       # outfitter lodging (also fills a known TFS gap)
    villegiature: 0.55          # a cottage; often a summer thing
    residence: 0.45
  # sweet spot = high huntability AND low pressure; weight in ranking:
  weight_in_ranking: 0.25

# --- Data confidence (be explicit north of the écoforestière edge) ------------
confidence:
  ecoforestiere_north_limit_lat: 52.0   # coverage thins beyond ~52 degN
  low_confidence_penalty: 0.15          # dampen ranking where data is coarse
  flag_north_of_limit: true

# --- Focus-area extraction -----------------------------------------------------
focus_areas:
  # NO COUNT CAP — areas are gated on QUALITY, not on how many we felt like showing.
  # The gate is ABSOLUTE (audit #50): a candidate must clear min_huntability on the
  # smoothed surface — a fixed physical bar, NOT a within-AOI percentile — hold
  # >= min_area_km2 of contiguous ground, and be one area-radius from the next. A
  # genuinely poor box legitimately returns FEW or ZERO areas and says so, instead of
  # dressing up its least-bad ground. However many clear the bar is the answer.
  min_huntability: 0.26          # absolute floor on the SMOOTHED surface a focus area must
                                 # clear (0..1). Calibrated to the smoothing below: good QC
                                 # boreal clusters smooth to ~0.35-0.41, so 0.28 admits the
                                 # top few % and a genuinely poor box returns 0 areas.
  # EXTENT, not quality. min_huntability decides whether a spot may ANCHOR a focus
  # area; these two decide how far that area then reaches. They admit nothing on their
  # own. Split out because one constant was doing both jobs, and once the rev-21 browse
  # rebuild gave the surface real contrast (peaks unchanged, shoulders gone) using the
  # admission bar as the extent bar collapsed lobes from ~8 km2 to ~1.5 km2 and returned
  # plans with zero areas.
  grow_frac_of_floor: 0.72       # extend over ground >= this share of the admission bar
  grow_rel: 0.80                 # ...and still related to this peak (multiplies gate_f)
  # A cell must also clear this share of the admission bar ON ITS OWN RAW VALUE, not
  # just on the smoothed surface (T6.3). Everything above thresholds the ~200 m Gaussian,
  # which is right for deciding SHAPE and wrong for deciding QUALITY: a blur lifts poor
  # ground over the bar whenever it sits beside good ground. Measured, that let an area
  # grow until 64-73% of it was BELOW the landscape mean, and trimming each area to its
  # own best half doubled how much of the achievable score it captured (0.14 -> 0.47).
  # Coherence survives because binary_closing + binary_fill_holes absorb isolated
  # rejects, so speckle is still smoothed over — only poor REGIONS are kept out.
  #
  # 0.7 is where the evidence stopped, not where it looked best. Sweeping three real
  # boxes: 0.7 raised capture on both boxes that had headroom (0.14->0.17, 0.07->0.20)
  # while every box kept areas; 0.85 raised it further (0.26, 0.21) but halved the area
  # count on two of three; 1.0 produced ZERO areas everywhere. Handing back better ground
  # is worth nothing if it is not enough ground to hunt.
  extent_raw_frac: 0.70
  min_area_km2: 3
  # A focus area is a chunk a party can actually WORK in the field (a drainage), not a
  # secteur — capped near ~18 km²; party size adds MORE areas, it doesn't inflate one.
  max_area_km2: 18
  min_separation_m: 0            # 0 = derive from max_area_km2 (one area-radius)
  smoothing_m: 200               # Gaussian σ (m) before region-grow; 100 was speckly, 350
                                 # over-flattened the peaks below the absolute floor
